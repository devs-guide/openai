name: Publish static assets to www

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: www-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc
          pandoc --version | head -n 1

      - name: Audit DOT two-lane migration
        env:
          DOT_AUDIT_DIR: ${{ runner.temp }}/dot-audit
        run: python3 actions/audit_dot.py

      - name: Validate repository source
        run: bash actions/validate.repository.sh

      - name: Build static Pages tree
        env:
          PUBLISH_DIR: static
          RELEASE_VERSION: 0.0.5
          SOURCE_SHA: ${{ env.CANDIDATE_SHA }}
        run: bash actions/www.pages.sh

      - name: Validate generated Pages tree
        env:
          EXPECTED_SOURCE_SHA: ${{ env.CANDIDATE_SHA }}
          STATIC_DIR: static
        run: bash actions/validate.pages.sh

      - name: Validate release contract
        env:
          RELEASE_VERSION: 0.0.5
        run: bash actions/validate.release.sh

      - name: Upload DOT migration audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dot-migration-audit
          path: ${{ runner.temp }}/dot-audit
          if-no-files-found: error

      - name: Upload Pages tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: www-static
          path: static
          if-no-files-found: error

  deploy-www:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download validated Pages tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: www-static
          path: static

      - name: Deploy static tree to orphan www branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static
          publish_branch: www
          force_orphan: true
          enable_jekyll: false

  validate-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_READY == 'true'
    needs: deploy-www
    uses: ./.github/workflows/www.pages.remote.yml
    with:
      source_sha: ${{ github.sha }}
